name: Build and deploy the interface

# Builds the store, pre-renders every answer, and publishes the result to
# GitHub Pages. The rendered site is roughly 443 MB across 32,000 files, so it
# is uploaded straight to Pages as an artifact and never committed: keeping it
# out of git is what stops the repository growing by that much on every push.
#
# Most of that is drawings, and two habits keep it down. The county map a brief
# opens on is written once and referenced rather than embedded in each of the
# 4,080 briefs, which is the difference between 405 MB and 649 MB. And a map
# framed to one county no longer carries the thirty-five counties outside the
# frame: `maps._path` takes a clip, because the simplification tolerance is in
# output pixels and a county frame magnifies the state by about thirty, so the
# state paths that cost 6 KB statewide cost 96 KB per answer there — 573 MB
# against 443. If this number starts climbing again, look for a picture that is
# identical across many answers and inlined in all of them, or one carrying
# geometry nobody can see. Pages serves a site up to 1 GB, so there is room and
# not a lot.
#
# Nothing here needs installing. The whole pipeline is the Python standard
# library, so the only setup step is having Python at all.
#
# Any pull request gets the full suite and a real render before it merges,
# whatever the branch is called. This used to name specific branches, which
# meant a branch nobody had thought to add got no checks at all while the
# comment here claimed otherwise.
#
# Publishing happens only from the default branch, because the github-pages
# environment refuses a deployment from anywhere else and does so two seconds
# in, which reads as a broken workflow rather than as the protection rule it is.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:      # the "Run workflow" button, for a rebuild on demand

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run waits rather than cancelling, so a deploy is never half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The pre-rendered build assembles comparisons in the browser, so the
      # parity suite drives that implementation against the Python one and fails
      # on any disagreement. It needs a JavaScript runtime to do that.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The dissolve pilot writes into the same store, so it runs as the last
      # step of the build rather than as a step here. It was a separate step
      # while a rebuild silently dropped its table; now a build that does not
      # produce it is not a build.
      - name: Build the store
        run: python3 etl/build.py

      - name: Verify the store
        run: python3 etl/verify.py

      - name: Run the test suites
        run: |
          python3 etl/test_project.py
          python3 agent/test_tools.py
          python3 agent/test_orchestrator.py
          python3 agent/test_viz.py
          python3 agent/test_reports.py
          python3 agent/test_blocks.py
          python3 app/test_server.py
          python3 app/test_parity.py
          python3 app/test_tables.py
          python3 evals/run.py --route

      - name: Pre-render the interface
        run: python3 app/export_static.py --out site --clean

      # Only the default branch publishes, so only it needs to package the
      # site. Skipping the upload elsewhere keeps pull request runs quick and
      # avoids storing a 256 MB artifact nobody will deploy.
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
