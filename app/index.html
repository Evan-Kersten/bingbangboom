<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Public Foundry</title>
<style>
/* Chart tokens are fetched from the server so the interface and the charts are
   one palette rather than two that nearly match. */
:root {
  color-scheme: light;
  --pf-surface: #fcfcfb; --pf-ink: #0b0b0b; --pf-ink-2: #52514e; --pf-muted: #898781;
  --pf-grid: #e1e0d9; --pf-axis: #c3c2b7; --pf-s1: #2a78d6; --pf-s2: #eb6834;
  --pf-track: #e6e5df; --pf-warning: #fab219; --pf-good: #0ca30c;
  --page: #f4f4f1; --panel: #ffffff; --shadow: rgba(11,11,11,.07);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --pf-surface: #1a1a19; --pf-ink: #ffffff; --pf-ink-2: #c3c2b7; --pf-muted: #898781;
    --pf-grid: #2c2c2a; --pf-axis: #383835; --pf-s1: #3987e5; --pf-s2: #d95926;
    --pf-track: #2c2c2a; --pf-warning: #fab219; --pf-good: #0ca30c;
    --page: #121211; --panel: #1a1a19; --shadow: rgba(0,0,0,.3);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--pf-ink);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.shell { display: grid; grid-template-columns: 296px 1fr; height: 100vh; }

/* ---------- sidebar ---------- */
aside {
  background: var(--panel); border-right: 1px solid var(--pf-grid);
  display: flex; flex-direction: column; overflow: hidden;
}
.brand { padding: 20px 20px 14px; display: flex; align-items: baseline; gap: 8px; }
.brand h1 { font-size: 15px; margin: 0; font-weight: 640; letter-spacing: -.01em; }
.mode {
  font-size: 10px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600;
  padding: 2px 7px; border-radius: 10px; background: var(--pf-track); color: var(--pf-ink-2);
}
.mode.full { background: color-mix(in srgb, var(--pf-good) 18%, transparent); color: var(--pf-good); }

.search { padding: 0 16px 12px; position: relative; }
.search input {
  width: 100%; padding: 9px 12px; font: inherit; font-size: 14px;
  border: 1px solid var(--pf-axis); border-radius: 7px;
  background: var(--pf-surface); color: var(--pf-ink);
}
.search input:focus { outline: 2px solid var(--pf-s1); outline-offset: -1px; border-color: transparent; }
.search .hint {
  position: absolute; right: 26px; top: 10px; font-size: 11px; color: var(--pf-muted);
  pointer-events: none;
}
.search input:focus + .hint { display: none; }

.results { overflow-y: auto; padding: 0 8px; flex: 0 0 auto; max-height: 40vh; }
.result {
  width: 100%; text-align: left; background: none; border: 0; font: inherit;
  padding: 8px 10px; border-radius: 6px; cursor: pointer; color: inherit;
  display: flex; flex-direction: column; gap: 1px;
}
.result:hover, .result:focus-visible { background: var(--pf-track); outline: none; }
.result .nm { font-size: 13.5px; }
.result .meta { font-size: 11.5px; color: var(--pf-muted); }

.chosen { padding: 14px 20px; border-top: 1px solid var(--pf-grid); }
.chosen .nm { font-size: 15px; font-weight: 620; }
.chosen .meta { font-size: 12px; color: var(--pf-muted); margin-top: 2px; }

.presets { flex: 1; overflow-y: auto; padding: 4px 12px 20px; }
.pgroup {
  font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--pf-muted);
  font-weight: 640; padding: 14px 8px 6px;
}
.preset {
  width: 100%; text-align: left; font: inherit; font-size: 13px; cursor: pointer;
  background: none; border: 0; color: var(--pf-ink-2);
  padding: 7px 10px; border-radius: 6px; line-height: 1.35;
}
.preset:hover:not(:disabled), .preset:focus-visible { background: var(--pf-track); color: var(--pf-ink); outline: none; }
.preset:disabled { opacity: .38; cursor: not-allowed; }
.preset:disabled::after { content: ' · no data'; font-size: 11px; color: var(--pf-muted); }

/* ---------- conversation ---------- */
main { display: flex; flex-direction: column; overflow: hidden; }
.thread { flex: 1; overflow-y: auto; padding: 32px 32px 8px; scroll-behavior: smooth; }
.inner { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 30px; }

.welcome { padding: 44px 0; }
.welcome h2 { font-size: 21px; margin: 0 0 10px; font-weight: 620; letter-spacing: -.01em; }
.welcome p { margin: 0 0 10px; color: var(--pf-ink-2); font-size: 14.5px; max-width: 60ch; }

.turn { display: flex; flex-direction: column; gap: 12px; animation: rise .22s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .turn { animation: none; } }

.q {
  align-self: flex-end; max-width: 78%; background: var(--pf-s1); color: #fff;
  padding: 9px 14px; border-radius: 14px 14px 3px 14px; font-size: 14px;
}
.a { display: flex; flex-direction: column; gap: 12px; }
.a p { margin: 0; font-size: 14.5px; }
.a ul { margin: 0; padding-left: 20px; font-size: 14px; color: var(--pf-ink-2); }

.card {
  background: var(--panel); border: 1px solid var(--pf-grid); border-radius: 9px;
  padding: 16px; overflow-x: auto; box-shadow: 0 1px 2px var(--shadow);
}
.card svg { display: block; }
table { border-collapse: collapse; font-size: 13px; width: 100%; }
th {
  text-align: left; font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--pf-muted); border-bottom: 1px solid var(--pf-axis); padding: 6px 14px 6px 0;
}
td { padding: 6px 14px 6px 0; border-bottom: 1px solid var(--pf-grid); font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }

/* §15.1 interpretation: what was understood, before anything else. Overlapping
   jurisdictions mean a name resolves to several governments, so a reader who
   does not know which one was answered cannot use the answer. */
.interp {
  display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline;
  font-size: 11.5px; color: var(--pf-muted);
  padding-bottom: 10px; border-bottom: 1px solid var(--pf-grid);
}
.interp .nm { font-size: 13px; font-weight: 620; color: var(--pf-ink); }
.interp .assume { color: var(--pf-warning); }

/* §15.1 figure: the answer as a quantity. Proportional figures at display size;
   tabular-nums would make the digits look loose. */
.figure {
  background: var(--panel); border: 1px solid var(--pf-grid); border-radius: 9px;
  padding: 14px 18px; box-shadow: 0 1px 2px var(--shadow);
  display: flex; flex-direction: column; gap: 2px; align-self: flex-start;
  min-width: 200px;
}
.figure .lbl {
  font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--pf-muted); font-weight: 620;
}
.figure .val { font-size: 27px; font-weight: 620; line-height: 1.15; letter-spacing: -.02em; }
.figure .leg { font-size: 11px; color: var(--pf-muted); margin-top: 3px; }

/* §15.1 next: only questions the data can answer for this entity. */
.next { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  font: inherit; font-size: 12.5px; cursor: pointer; color: var(--pf-ink-2);
  background: var(--panel); border: 1px solid var(--pf-grid);
  padding: 6px 12px; border-radius: 15px; line-height: 1.3;
}
.chip:hover, .chip:focus-visible { border-color: var(--pf-s1); color: var(--pf-ink); outline: none; }

.violation {
  font-size: 12px; color: #0b0b0b; background: var(--pf-warning);
  padding: 7px 11px; border-radius: 6px;
}

/* The rules panel is the point of the product, so it is a first-class element
   rather than a footnote: these are the constraints the answer is bound by. */
.rules { border-left: 2px solid var(--pf-warning); padding-left: 14px; }
.rules summary {
  cursor: pointer; font-size: 12px; color: var(--pf-muted); list-style: none;
  display: flex; align-items: center; gap: 6px;
}
.rules summary::-webkit-details-marker { display: none; }
.rules summary::before { content: '▸'; font-size: 9px; transition: transform .15s; }
.rules[open] summary::before { transform: rotate(90deg); }
.rules ul { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.rules li { font-size: 12.5px; color: var(--pf-ink-2); line-height: 1.5; }
.rules code {
  font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px;
  background: var(--pf-track); padding: 1.5px 5px; border-radius: 3px; margin-right: 7px;
}
.rules .never code { background: var(--pf-warning); color: #0b0b0b; }

.trace {
  display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
  font-size: 10.5px; color: var(--pf-muted);
}
.trace span {
  font-family: ui-monospace, Menlo, Consolas, monospace;
  background: var(--pf-track); padding: 2px 7px; border-radius: 4px;
}

.report { background: var(--panel); border: 1px solid var(--pf-grid); border-radius: 9px; padding: 22px; }
.report .pf-report { max-width: none; gap: 26px; }
.report .pf-report header h1 { font-size: 19px; }

/* ---------- composer ---------- */
.composer { padding: 12px 32px 26px; }
.composer form {
  max-width: 720px; margin: 0 auto; display: flex; gap: 9px; align-items: flex-end;
  background: var(--panel); border: 1px solid var(--pf-axis); border-radius: 12px;
  padding: 8px 8px 8px 14px; box-shadow: 0 1px 3px var(--shadow);
}
.composer form:focus-within { border-color: var(--pf-s1); }
.composer textarea {
  flex: 1; border: 0; resize: none; background: none; color: inherit; font: inherit;
  font-size: 14.5px; padding: 6px 0; max-height: 140px; outline: none;
}
.composer button {
  border: 0; background: var(--pf-s1); color: #fff; width: 32px; height: 32px;
  border-radius: 8px; cursor: pointer; font-size: 15px; line-height: 1; flex: 0 0 auto;
}
.composer button:disabled { opacity: .4; cursor: not-allowed; }
.note { max-width: 720px; margin: 8px auto 0; font-size: 11.5px; color: var(--pf-muted); }

.dots { display: inline-flex; gap: 3px; }
.dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--pf-muted); animation: pulse 1.1s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes pulse { 0%,60%,100% { opacity: .25; } 30% { opacity: 1; } }

@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; }
  aside { border-right: 0; border-bottom: 1px solid var(--pf-grid); max-height: 46vh; }
  .thread, .composer { padding-left: 18px; padding-right: 18px; }
}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><h1>Public Foundry</h1><span class="mode" id="mode">…</span></div>
    <div class="search">
      <input id="q" type="search" placeholder="Search 1,529 governments" autocomplete="off" aria-label="Search governments">
      <span class="hint">/</span>
    </div>
    <div class="results" id="results"></div>
    <div class="chosen" id="chosen" hidden></div>
    <div class="presets" id="presets"></div>
  </aside>

  <main>
    <div class="thread" id="thread">
      <div class="inner" id="inner">
        <div class="welcome">
          <h2>Ask about an Oregon government</h2>
          <p>Search for a city, county, school district or special district, then pick a
          question. Every figure comes from a tool call against the real records, and
          every answer carries the rules it is bound by.</p>
          <p id="welcome-mode"></p>
        </div>
      </div>
    </div>
    <div class="composer">
      <form id="composer">
        <textarea id="input" rows="1" placeholder="Ask a question…"></textarea>
        <button type="submit" id="send" aria-label="Send">↑</button>
      </form>
      <p class="note" id="composer-note"></p>
    </div>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
let entity = null, busy = false;

async function api(path, body) {
  const options = body
    ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
    : {};
  const response = await fetch(path, options);
  return response.json();
}

(async function init() {
  const info = await api('/api/mode');
  $('mode').textContent = info.mode;
  $('mode').classList.toggle('full', info.mode === 'full');
  $('q').placeholder = `Search ${info.entities.toLocaleString()} governments`;
  // Charts arrive as SVG using the same custom properties, so the palette is
  // defined once on the server and shared.
  const style = document.createElement('style');
  style.textContent = info.css;
  document.head.appendChild(style);

  const grounded = info.mode === 'grounded';
  $('welcome-mode').textContent = grounded
    ? 'Running without a model, so the presets answer and free text does not. The figures, charts and rules are the same ones a model would be handed.'
    : 'A model is attached, so free-text questions run through the full agent loop.';
  $('composer-note').textContent = grounded
    ? 'Free text needs ANTHROPIC_API_KEY. Presets work now.'
    : 'Ask anything, or pick a preset.';
  loadPresets();
})();

/* ---------- search ---------- */
let searchTimer;
$('q').addEventListener('input', (event) => {
  clearTimeout(searchTimer);
  const term = event.target.value;
  searchTimer = setTimeout(async () => {
    if (term.trim().length < 2) { $('results').innerHTML = ''; return; }
    const { matches } = await api('/api/search?q=' + encodeURIComponent(term));
    $('results').innerHTML = matches.map((m, i) => `
      <button class="result" data-i="${i}">
        <span class="nm">${esc(m.common_name || m.legal_name)}</span>
        <span class="meta">${esc(m.gov_type_name)}${m.host_county ? ' · ' + esc(title(m.host_county)) : ''}</span>
      </button>`).join('');
    [...$('results').children].forEach((node) => {
      node.onclick = () => choose(matches[node.dataset.i]);
    });
  }, 130);
});

document.addEventListener('keydown', (event) => {
  if (event.key === '/' && document.activeElement !== $('q') && document.activeElement !== $('input')) {
    event.preventDefault(); $('q').focus();
  }
});

function choose(match) {
  entity = match;
  $('chosen').hidden = false;
  $('chosen').innerHTML = `<div class="nm">${esc(match.common_name || match.legal_name)}</div>
    <div class="meta">${esc(match.legal_name)}</div>`;
  $('results').innerHTML = '';
  $('q').value = '';
  loadPresets();
}

async function loadPresets() {
  const { presets } = await api('/api/presets' + (entity ? '?pid6=' + entity.pid6 : ''));
  const groups = {};
  presets.forEach((p) => { (groups[p.group] ||= []).push(p); });
  $('presets').innerHTML = Object.entries(groups).map(([group, items]) => `
    <div class="pgroup">${esc(group)}</div>
    ${items.map((p) => `<button class="preset" data-id="${p.id}" ${
      (!entity && p.id !== 'ecosystem') || !p.available ? 'disabled' : ''
    }>${esc(p.label)}</button>`).join('')}`).join('');
  [...document.querySelectorAll('.preset')].forEach((node) => {
    node.onclick = () => ask(node.textContent.replace(' · no data', ''), { id: node.dataset.id });
  });
}

/* ---------- conversation ---------- */
async function ask(label, payload) {
  if (busy) return;
  busy = true; $('send').disabled = true;
  document.querySelector('.welcome')?.remove();

  const turn = document.createElement('div');
  turn.className = 'turn';
  turn.innerHTML = `<div class="q">${esc(label)}</div>
    <div class="a"><span class="dots"><i></i><i></i><i></i></span></div>`;
  $('inner').appendChild(turn);
  scroll();

  const result = payload.id
    ? await api('/api/preset', { id: payload.id, pid6: entity?.pid6 })
    : await api('/api/ask', { question: label });

  turn.querySelector('.a').innerHTML = render(result);
  turn.querySelectorAll('.chip').forEach((chip) => {
    chip.onclick = () => {
      const preset = [...document.querySelectorAll('.preset')]
        .find((p) => p.textContent.replace(' · no data', '') === chip.textContent);
      if (preset && !preset.disabled) preset.click();
    };
  });
  busy = false; $('send').disabled = false;
  scroll();
}

/* One renderer per block kind in the §15 vocabulary. The server chooses which
   blocks appear and in what order; this only draws them. */
const BLOCK = {
  interpretation: (b) => `<div class="interp">
      <span class="nm">${esc(b.entity)}</span>
      <span>${esc(b.gov_type)}${b.host_county ? ' · ' + esc(b.host_county) + ' County' : ''}</span>
      ${Object.entries(b.vintages || {}).map(([k, v]) =>
        `<span>${esc(k.replace(/_/g, ' '))} ${esc(v)}</span>`).join('')}
      ${b.assumption ? `<span class="assume">${esc(b.assumption)}</span>` : ''}
    </div>`,

  answer: (b) => `<p>${esc(b.text)}</p>`,

  figure: (b) => `<div class="figure">
      <div class="lbl">${esc(b.label)}${b.year ? ' · ' + esc(b.year) : ''}</div>
      <div class="val">${esc(b.value)}</div>
      ${(b.legend || []).map((l) => `<div class="leg">${esc(l)}</div>`).join('')}
    </div>`,

  chart: (b) => `<div class="card pf-viz">${b.svg}</div>`,
  map: (b) => `<div class="card pf-viz">${b.svg}</div>`,
  report: (b) => `<div class="report pf-viz">${b.html}</div>`,
  list: (b) => `<ul>${b.items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>`,

  table: (b) => {
    const columns = Object.keys(b.rows[0] || {});
    return `<div class="card"><table><thead><tr>${
      columns.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${
      b.rows.map((row) => `<tr>${columns.map((c) => `<td>${esc(row[c])}</td>`).join('')}</tr>`).join('')
    }</tbody></table></div>`;
  },

  limits: (b) => `<details class="rules"><summary>${b.rules.length} rules bind this answer</summary><ul>${
    b.rules.map((rule) => `<li class="${rule.kind === 'never' ? 'never' : ''}"><code>${
      esc(rule.rule)}</code>${rule.kind === 'never' ? 'Never: ' : ''}${esc(rule.guidance)}</li>`).join('')
  }</ul></details>`,

  next: (b) => `<div class="next">${
    b.questions.map((q) => `<button class="chip">${esc(q)}</button>`).join('')}</div>`,
};

function render(result) {
  const parts = (result.blocks || []).map((b) => (BLOCK[b.kind] ? BLOCK[b.kind](b) : ''));
  if (result.violations?.length) {
    parts.push(`<div class="violation">§15: ${result.violations.map(esc).join('; ')}</div>`);
  }
  if (result.trace?.length) {
    parts.push(`<div class="trace">${result.trace.map((t) => `<span>${esc(t)}</span>`).join('')}</div>`);
  }
  return parts.join('');
}

$('composer').addEventListener('submit', (event) => {
  event.preventDefault();
  const text = $('input').value.trim();
  if (!text) return;
  $('input').value = ''; $('input').style.height = 'auto';
  ask(text, {});
});
$('input').addEventListener('input', (event) => {
  event.target.style.height = 'auto';
  event.target.style.height = Math.min(event.target.scrollHeight, 140) + 'px';
});
$('input').addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    $('composer').requestSubmit();
  }
});

function scroll() { $('thread').scrollTop = $('thread').scrollHeight; }
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function title(value) {
  return String(value).toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase());
}
</script>
</body>
</html>
